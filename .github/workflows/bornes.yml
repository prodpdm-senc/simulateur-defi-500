name: Bornes de recharge (hebdomadaire)
on:
  schedule:
    - cron: '17 9 * * 1'   # lundi 9 h 17 UTC
  workflow_dispatch:
permissions:
  contents: write
jobs:
  bornes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Itinéraire et bornes (RNCan/AFDC, OpenStreetMap)
        run: python3 scripts/build_route.py
      - name: Publier si les bornes ont changé
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/route.js data/route.json data/.elev_cache.json
          git diff --cached --quiet && echo "Aucun changement" || (git commit -m "Bornes de recharge : mise à jour hebdomadaire" && git push)
